<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Staff Admin — Aspro Construction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body data-page="admin.html">
  <header id="site-header"></header>

  <div class="admin-wrap">
    <!-- LOGIN -->
    <div id="login-view">
      <h1 style="font-size:1.8rem">Staff Login</h1>
      <p class="note">Sign in to manage projects, team, testimonials, and field updates.</p>
      <form id="login-form" style="max-width:380px;margin-top:20px">
        <div class="field"><label for="login-email">Email</label>
          <input id="login-email" type="email" required autocomplete="username"></div>
        <div class="field"><label for="login-password">Password</label>
          <input id="login-password" type="password" required autocomplete="current-password"></div>
        <button type="submit" class="btn btn-primary">Sign in</button>
        <div id="login-status"></div>
      </form>
      <p class="note" style="margin-top:20px">
        <a href="index.html">&larr; Back to website</a></p>
    </div>

    <!-- APP -->
    <div id="app-view" class="hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div>
          <h1 style="font-size:1.8rem;margin:0">Content Manager</h1>
          <p class="note" style="margin:.2em 0">Signed in as <strong id="who"></strong></p>
        </div>
        <div>
          <a href="index.html" class="btn" style="background:#fff;border:1px solid var(--line)">View site</a>
          <button id="logout" class="btn btn-dark">Log out</button>
        </div>
      </div>

      <div id="tabs" class="admin-tabs"></div>

      <div class="service" style="background:#fff;margin-bottom:26px">
        <h3 id="editor-title" style="margin-top:0">Add new item</h3>
        <form id="editor"></form>
      </div>

      <h3 style="font-family:'Oswald'">Existing items</h3>
      <div id="list"></div>
    </div>
  </div>

  <footer id="site-footer"></footer>
  <script src="app.js"></script>
  <script src="admin.js"></script>
</body>
</html>
