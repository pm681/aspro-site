<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects — Aspro Construction</title>
  <meta name="description" content="Explore Aspro Construction's portfolio of custom homes, multifamily, commercial, and institutional projects.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body data-page="projects.html">
  <header id="site-header"></header>

  <section class="section band">
    <div class="container">
      <span class="eyebrow">Portfolio</span>
      <h1 style="font-size:2.6rem;margin:.2em 0">Our Projects</h1>
      <p style="max-width:640px;color:#c3c7d0">A selection of the homes, communities, and buildings we've delivered across every sector we serve.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div id="filters" class="admin-tabs" style="margin-bottom:26px"></div>
      <div id="projects" class="grid grid-3"></div>
      <div id="booklet-cta" style="text-align:center;margin-top:44px"></div>
    </div>
  </section>

  <footer id="site-footer"></footer>
  <script src="app.js"></script>
  <script>
    ASPRO.renderProjects("projects", { filters: "filters" });
    ASPRO.showBooklet("booklet-cta");
  </script>
</body>
</html>
